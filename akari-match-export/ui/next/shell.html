<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoLAdvisor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23B45309'/><path d='M8 21l5-5 4 4 7-10' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="../design-system.css">
</head>
<body>
<div class="shell">
  <aside class="shell-side">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 16l4.5-4.5 3.5 3.5L18 8" stroke="currentColor" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name" style="white-space:nowrap">LoLAdvisor</span>
      <span class="brand-sub" style="display:none">SHELL</span>
    </div>

    <nav class="shell-nav" aria-label="主导航">
      <button type="button" class="nav-item on" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9.5 21v-6h5v6"/></svg>
        <span class="t">主页</span>
      </button>
      <button type="button" class="nav-item" data-view="draft">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
        <span class="t">选人助手</span>
      </button>
      <button type="button" class="nav-item" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M9 9.5V19"/></svg>
        <span class="t">仪表盘</span>
      </button>
    </nav>

    <div class="shell-side-foot">
      <div class="svc" id="footDraft"><span class="status-dot off"></span><span>选人助手 未启动</span></div>
      <div class="svc" id="footDash"><span class="status-dot off"></span><span>仪表盘 未启动</span></div>
      <div class="faint" id="footVersion">LoLAdvisor v2.3.1</div>
    </div>
  </aside>

  <main class="shell-main">
    <div class="shell-view on" id="view-home">
      <iframe id="frame-home" title="主页" src="" allow="clipboard-write"></iframe>
      <div class="shell-loading" id="loading-home">
        <div class="in"><span class="spin"></span>正在加载主页…</div>
      </div>
    </div>

    <div class="shell-view" id="view-draft">
      <div class="offline-wrap hidden" id="offline-draft">
        <div class="empty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3M15 3v3M6 6h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><path d="M12 12l4-4"/></svg>
          </div>
          <div class="empty-title">选人助手未启动</div>
          <div class="empty-hint">选人助手服务尚未启动。启动方式：在 LoLAdvisor 中点击「启动选人助手」，或运行 run-champ-select.cmd（默认端口 8788）。启动后点击下方按钮重新连接。</div>
          <div class="empty-actions">
            <button type="button" class="btn btn-primary btn-sm" id="btnRetryDraft">重新检测</button>
          </div>
        </div>
      </div>
      <iframe id="frame-draft" title="选人助手" src="" allow="clipboard-write; autoplay"></iframe>
      <div class="shell-loading" id="loading-draft">
        <div class="in"><span class="spin"></span>正在加载选人助手…</div>
      </div>
    </div>

    <div class="shell-view" id="view-dashboard">
      <div class="offline-wrap hidden" id="offline-dashboard">
        <div class="empty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M9 9.5V19"/></svg>
          </div>
          <div class="empty-title">仪表盘未启动</div>
          <div class="empty-hint">Web 仪表盘服务尚未启动。启动方式：运行 run-web.cmd（默认端口 8765），或在 LoLAdvisor 设置中开启。启动后点击下方按钮重新连接。</div>
          <div class="empty-actions">
            <button type="button" class="btn btn-primary btn-sm" id="btnRetryDash">重新检测</button>
          </div>
        </div>
      </div>
      <iframe id="frame-dashboard" title="仪表盘" src="" allow="clipboard-write"></iframe>
      <div class="shell-loading" id="loading-dashboard">
        <div class="in"><span class="spin"></span>正在加载仪表盘…</div>
      </div>
    </div>
  </main>
</div>

<script src="shell.js"></script>
</body>
</html>
